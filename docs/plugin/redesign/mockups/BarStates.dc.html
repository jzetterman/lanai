<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lanai bar glyph states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7aa2f7}a:hover{color:#c0caf5}
</style>
</helmet>
<div style="width: 1000px; height: 300px; box-sizing: border-box; background: #13141c; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #c0caf5; padding: 48px 40px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; align-items: start">

  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="height: 30px; background: #1a1b26; border: 1px solid #292e42; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; gap: 12px; color: #a9b1d6">
      <span style="width: 22px; height: 2px; background: #292e42; display: block"></span>
      <div style="height: 30px; width: 30px; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" role="img" aria-label="Lanai, stopped"><rect x="2.5" y="2" width="13" height="10.5"/><path d="M7.2 4.8v5h3.8"/><path d="M6 15.5h6"/></svg>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; font-weight: 600">Stopped</div>
      <div style="font-size: 11px; color: #8c94bf">Bar foreground</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="height: 30px; background: #1a1b26; border: 1px solid #292e42; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; gap: 12px; color: #a9b1d6; position: relative">
      <span style="width: 22px; height: 2px; background: #292e42; display: block"></span>
      <div style="height: 30px; width: 30px; display: flex; align-items: center; justify-content: center; color: {{accent}}; border-bottom: 2px solid {{accent}}; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" role="img" aria-label="Lanai, running"><rect x="2.5" y="2" width="13" height="10.5"/><path d="M7.2 4.8v5h3.8"/><path d="M6 15.5h6"/></svg>
      </div>
      <div style="position: absolute; right: 0; top: 38px; background: #1f2335; border: 1px solid #3b4261; padding: 6px 10px; font-size: 11px; color: #c0caf5; white-space: nowrap; z-index: 2">Running · right-click opens</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 30px">
      <div style="font-size: 13px; font-weight: 600">Running</div>
      <div style="font-size: 11px; color: #8c94bf">Accent and underline</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="height: 30px; background: #1a1b26; border: 1px solid #292e42; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; gap: 12px; color: #a9b1d6">
      <span style="width: 22px; height: 2px; background: #292e42; display: block"></span>
      <div style="height: 30px; width: 30px; display: flex; align-items: center; justify-content: center; position: relative">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" role="img" aria-label="Lanai, busy"><rect x="2.5" y="2" width="13" height="10.5"/><path d="M7.2 4.8v5h3.8"/><path d="M6 15.5h6"/></svg>
        <span style="position: absolute; left: 0; bottom: 0; height: 2px; width: 42%; background: {{accent}}; display: block"></span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; font-weight: 600">Busy</div>
      <div style="font-size: 11px; color: #8c94bf">Underline fills with progress</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="height: 30px; background: #1a1b26; border: 1px solid #292e42; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; gap: 12px; color: #a9b1d6">
      <span style="width: 22px; height: 2px; background: #292e42; display: block"></span>
      <div style="height: 30px; width: 30px; display: flex; align-items: center; justify-content: center; position: relative">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" role="img" aria-label="Lanai, setup waiting"><rect x="2.5" y="2" width="13" height="10.5"/><path d="M7.2 4.8v5h3.8"/><path d="M6 15.5h6"/></svg>
        <span style="position: absolute; right: 4px; top: 5px; width: 6px; height: 6px; background: #e0af68; display: block; box-shadow: 0 0 0 2px #1a1b26"></span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; font-weight: 600">Your turn</div>
      <div style="font-size: 11px; color: #8c94bf">Setup waits on you</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="height: 30px; background: #1a1b26; border: 1px solid #292e42; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; gap: 12px; color: #a9b1d6">
      <span style="width: 22px; height: 2px; background: #292e42; display: block"></span>
      <div style="height: 30px; width: 30px; display: flex; align-items: center; justify-content: center; position: relative">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" role="img" aria-label="Lanai, failed"><rect x="2.5" y="2" width="13" height="10.5"/><path d="M7.2 4.8v5h3.8"/><path d="M6 15.5h6"/></svg>
        <span style="position: absolute; right: 4px; top: 5px; width: 6px; height: 6px; background: #f7768e; display: block; box-shadow: 0 0 0 2px #1a1b26"></span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; font-weight: 600">Failed</div>
      <div style="font-size: 11px; color: #8c94bf">Red badge</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7aa2f7","options":["#7aa2f7","#cba6f7","#a7c080","#d79921"]},"$preview":{"width":1000,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#7aa2f7' };
  }
}
</script>
</body>
</html>
