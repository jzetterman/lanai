<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lanai panel, settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7aa2f7}a:hover{color:#c0caf5}
button{font-family:inherit}
select{font-family:inherit}
</style>
</helmet>
<div style="width: 460px; height: 680px; box-sizing: border-box; background: #13141c; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #c0caf5">
  <div style="height: 30px; background: #1a1b26; border-bottom: 1px solid #292e42; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px; color: #a9b1d6">
    <div style="display: flex; gap: 14px"><span style="color: {{accent}}; font-weight: 700">1</span><span>2</span><span>3</span></div>
    <div style="height: 30px; width: 30px; display: flex; align-items: center; justify-content: center; color: {{accent}}; border-bottom: 2px solid {{accent}}; box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" role="img" aria-label="Lanai"><rect x="2.5" y="2" width="13" height="10.5"/><path d="M7.2 4.8v5h3.8"/><path d="M6 15.5h6"/></svg>
    </div>
  </div>

  <section style="width: 420px; margin: 8px 20px 0; background: #1a1b26; border: 1px solid #3b4261; box-sizing: border-box" aria-label="Lanai">
    <div style="padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="width: 44px; height: 44px; flex: none; border: 1px solid #3b4261; display: flex; align-items: center; justify-content: center; color: {{accent}}">
          <svg width="24" height="24" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="2.5" y="2" width="13" height="10.5"/><path d="M7.2 4.8v5h3.8"/><path d="M6 15.5h6"/></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em">Windows</div>
          <div style="display: flex; gap: 12px; font-size: 12px; color: #8c94bf">
            <span style="display: inline-flex; align-items: center; gap: 5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="7" width="18" height="10"/><path d="M7 7v10M11 7v10M15 7v10M3 20h18"/></svg>8 GiB</span>
            <span style="display: inline-flex; align-items: center; gap: 5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="6" y="6" width="12" height="12"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>4 cores</span>
            <span style="display: inline-flex; align-items: center; gap: 5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Auto</span>
          </div>
        </div>
        <div style="display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border: 1px solid rgba(158,206,106,0.35); background: rgba(158,206,106,0.08); color: #9ece6a; font-size: 12px; font-weight: 500; flex: none">
          <span style="width: 6px; height: 6px; background: #9ece6a; display: block"></span>Running
        </div>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; height: 44px; background: {{accent}}; color: #16161e; border: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; font-weight: 600">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18"/></svg>Open window
        </button>
        <button type="button" aria-label="Shut down" style="width: 44px; height: 44px; background: transparent; border: 1px solid #3b4261; color: #c0caf5; display: flex; align-items: center; justify-content: center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
        </button>
        <button type="button" aria-label="More actions" style="width: 44px; height: 44px; background: transparent; border: 1px solid #3b4261; color: #c0caf5; display: flex; align-items: center; justify-content: center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
      </div>
    </div>

    <button type="button" aria-expanded="true" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 20px; background: transparent; border: 0; border-top: 1px solid #292e42; color: #c0caf5; font-size: 13px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="1.6" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><rect x="13" y="5" width="4" height="4"/><rect x="7" y="15" width="4" height="4"/></svg>
      <span style="flex: 1">Settings</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #e0af68"><span style="width: 5px; height: 5px; background: #e0af68; display: block"></span>Unsaved</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div style="padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="background: #1f2335; border: 1px solid {{accent}}; padding: 12px; display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 11px; color: #8c94bf; letter-spacing: 0.08em; text-transform: uppercase">Memory</div>
          <div style="display: flex; align-items: center; justify-content: space-between">
            <button type="button" aria-label="Less memory" style="width: 36px; height: 36px; background: transparent; border: 1px solid #3b4261; color: #c0caf5; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            <div><span style="font-size: 20px; font-weight: 600">12</span><span style="font-size: 12px; color: #8c94bf"> GiB</span></div>
            <button type="button" aria-label="More memory" style="width: 36px; height: 36px; background: transparent; border: 1px solid #3b4261; color: #c0caf5; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
          </div>
        </div>
        <div style="background: #1f2335; border: 1px solid #292e42; padding: 12px; display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 11px; color: #8c94bf; letter-spacing: 0.08em; text-transform: uppercase">Cores</div>
          <div style="display: flex; align-items: center; justify-content: space-between">
            <button type="button" aria-label="Fewer cores" style="width: 36px; height: 36px; background: transparent; border: 1px solid #3b4261; color: #c0caf5; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            <div><span style="font-size: 20px; font-weight: 600">4</span></div>
            <button type="button" aria-label="More cores" style="width: 36px; height: 36px; background: transparent; border: 1px solid #3b4261; color: #c0caf5; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
          </div>
        </div>
      </div>
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 11px; color: #8c94bf; letter-spacing: 0.08em; text-transform: uppercase">Windows scale</span>
        <span style="position: relative; display: block">
          <select style="width: 100%; height: 40px; background: #1f2335; border: 1px solid #3b4261; color: #c0caf5; font-size: 13px; padding: 0 36px 0 12px; appearance: none; -webkit-appearance: none; border-radius: 0">
            <option value="auto">Match my monitor</option>
            <option value="100">100%</option>
            <option value="125">125%</option>
            <option value="150">150%</option>
            <option value="200">200%</option>
          </select>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="2" aria-hidden="true" style="position: absolute; right: 12px; top: 13px; pointer-events: none"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </label>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: #8c94bf">
        <div style="display: flex; align-items: center; gap: 7px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg>
          Memory and cores apply on next start
        </div>
        <div style="display: flex; align-items: center; gap: 7px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          Scale applies now and replaces one set in Windows
        </div>
      </div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; padding-top: 4px">
        <button type="button" style="height: 36px; padding: 0 16px; background: transparent; border: 1px solid #3b4261; color: #c0caf5; font-size: 12px">Reset</button>
        <button type="button" style="height: 36px; padding: 0 18px; background: {{accent}}; border: 0; color: #16161e; font-size: 12px; font-weight: 600">Save</button>
      </div>
    </div>

    <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 20px; background: transparent; border: 0; border-top: 1px solid #292e42; color: #c0caf5; font-size: 13px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="1.6" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      <span style="flex: 1">Snapshots</span>
      <span style="font-size: 12px; color: #8c94bf">3</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 20px; background: transparent; border: 0; border-top: 1px solid #292e42; color: #c0caf5; font-size: 13px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="1.6" aria-hidden="true"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/></svg>
      <span style="flex: 1">Logs</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7aa2f7","options":["#7aa2f7","#cba6f7","#a7c080","#d79921"]},"$preview":{"width":460,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#7aa2f7' };
  }
}
</script>
</body>
</html>
