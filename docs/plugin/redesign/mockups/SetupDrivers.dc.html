<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lanai panel, setup in Windows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7aa2f7}a:hover{color:#c0caf5}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 460px; height: 620px; box-sizing: border-box; background: #13141c; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #c0caf5">
  <div style="height: 30px; background: #1a1b26; border-bottom: 1px solid #292e42; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px; color: #a9b1d6">
    <div style="display: flex; gap: 14px"><span style="color: {{accent}}; font-weight: 700">1</span><span>2</span><span>3</span></div>
    <div style="height: 30px; width: 30px; display: flex; align-items: center; justify-content: center; color: {{accent}}; border-bottom: 2px solid {{accent}}; box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" role="img" aria-label="Lanai, running"><rect x="2.5" y="2" width="13" height="10.5"/><path d="M7.2 4.8v5h3.8"/><path d="M6 15.5h6"/></svg>
    </div>
  </div>

  <section style="width: 420px; margin: 8px 20px 0; background: #1a1b26; border: 1px solid #3b4261; box-sizing: border-box" aria-label="Lanai">
    <div style="padding: 20px; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="width: 44px; height: 44px; flex: none; border: 1px solid #3b4261; display: flex; align-items: center; justify-content: center; color: {{accent}}">
          <svg width="24" height="24" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="2.5" y="2" width="13" height="10.5"/><path d="M7.2 4.8v5h3.8"/><path d="M6 15.5h6"/></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em">Windows</div>
          <div style="font-size: 12px; color: #8c94bf">Step 5 of 6</div>
        </div>
        <div style="display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border: 1px solid rgba(224,175,104,0.4); background: rgba(224,175,104,0.08); color: #e0af68; font-size: 12px; font-weight: 500; flex: none">
          <span style="width: 6px; height: 6px; background: #e0af68; display: block"></span>Setup
        </div>
      </div>

      <ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px" aria-label="Setup progress">
        <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 3px; background: {{accent}}; display: block"></span><span style="font-size: 10px; color: #8c94bf">Check</span></li>
        <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 3px; background: {{accent}}; display: block"></span><span style="font-size: 10px; color: #8c94bf">Packages</span></li>
        <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 3px; background: {{accent}}; display: block"></span><span style="font-size: 10px; color: #8c94bf">Snapshot</span></li>
        <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 3px; background: {{accent}}; display: block"></span><span style="font-size: 10px; color: #8c94bf">Prepare</span></li>
        <li style="display: flex; flex-direction: column; gap: 6px" aria-current="step"><span style="height: 3px; background: #e0af68; display: block"></span><span style="font-size: 10px; color: #e0af68; font-weight: 600">Drivers</span></li>
        <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 3px; background: #292e42; display: block"></span><span style="font-size: 10px; color: #8c94bf">Verify</span></li>
      </ol>

      <div style="background: #1f2335; border: 1px solid #292e42; padding: 18px; display: flex; flex-direction: column; gap: 16px">
        <div style="font-size: 14px; font-weight: 600">Finish in Windows</div>
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
          <li style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #c0caf5"><span style="width: 22px; height: 22px; flex: none; border: 1px solid #3b4261; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #a9b1d6">1</span>Open the Lanai setup drive</li>
          <li style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #c0caf5"><span style="width: 22px; height: 22px; flex: none; border: 1px solid #3b4261; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #a9b1d6">2</span>Run <code style="font-family: inherit; color: {{accent}}">setup.cmd</code></li>
          <li style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #a9b1d6"><span style="width: 22px; height: 22px; flex: none; border: 1px dashed #3b4261; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #8c94bf">3</span>Windows restarts by itself for checks</li>
        </ol>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="height: 2px; background: #292e42; position: relative; overflow: hidden" aria-hidden="true">
            <div style="position: absolute; left: 30%; width: 28%; height: 2px; background: #e0af68"></div>
          </div>
          <div style="font-size: 11px; color: #8c94bf">Waiting for setup.cmd. Shut down only if it asks you to.</div>
        </div>
      </div>

      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; height: 44px; background: transparent; color: #c0caf5; border: 1px solid #3b4261; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; font-weight: 500">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18"/></svg>Reopen window
        </button>
        <button type="button" aria-label="Shut down and stop setup" title="Shut down" style="width: 44px; height: 44px; background: transparent; border: 1px solid #3b4261; color: #c0caf5; display: flex; align-items: center; justify-content: center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
        </button>
      </div>
    </div>

    <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 20px; background: transparent; border: 0; border-top: 1px solid #292e42; color: #c0caf5; font-size: 13px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="1.6" aria-hidden="true"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/></svg>
      <span style="flex: 1">Logs</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7aa2f7","options":["#7aa2f7","#cba6f7","#a7c080","#d79921"]},"$preview":{"width":460,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#7aa2f7' };
  }
}
</script>
</body>
</html>
