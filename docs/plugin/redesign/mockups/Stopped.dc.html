<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lanai panel, stopped</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7aa2f7}a:hover{color:#c0caf5}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 460px; height: 680px; box-sizing: border-box; background: #13141c; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #c0caf5">
  <div style="height: 30px; background: #1a1b26; border-bottom: 1px solid #292e42; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px; color: #a9b1d6">
    <div style="display: flex; gap: 14px"><span style="color: {{accent}}; font-weight: 700">1</span><span>2</span><span>3</span></div>
    <div style="height: 30px; width: 30px; display: flex; align-items: center; justify-content: center; color: #a9b1d6; background: #24283b">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" role="img" aria-label="Lanai"><rect x="2.5" y="2" width="13" height="10.5"/><path d="M7.2 4.8v5h3.8"/><path d="M6 15.5h6"/></svg>
    </div>
  </div>

  <section style="width: 420px; margin: 8px 20px 0; background: #1a1b26; border: 1px solid #3b4261; box-sizing: border-box" aria-label="Lanai">
    <div style="padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="width: 44px; height: 44px; flex: none; border: 1px solid #3b4261; display: flex; align-items: center; justify-content: center; color: #8c94bf">
          <svg width="24" height="24" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="2.5" y="2" width="13" height="10.5"/><path d="M7.2 4.8v5h3.8"/><path d="M6 15.5h6"/></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em">Windows</div>
          <div style="display: flex; gap: 12px; font-size: 12px; color: #8c94bf">
            <span style="display: inline-flex; align-items: center; gap: 5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="7" width="18" height="10"/><path d="M7 7v10M11 7v10M15 7v10M3 20h18"/></svg>8 GiB</span>
            <span style="display: inline-flex; align-items: center; gap: 5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="6" y="6" width="12" height="12"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>4 cores</span>
            <span style="display: inline-flex; align-items: center; gap: 5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Auto</span>
          </div>
        </div>
        <div style="display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border: 1px solid #3b4261; background: #1f2335; color: #a9b1d6; font-size: 12px; font-weight: 500; flex: none">
          <span style="width: 6px; height: 6px; border: 1px solid #a9b1d6; box-sizing: border-box; display: block"></span>Stopped
        </div>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; height: 44px; background: {{accent}}; color: #16161e; border: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; font-weight: 600">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Start Windows
        </button>
      </div>
    </div>

    <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 20px; background: transparent; border: 0; border-top: 1px solid #292e42; color: #c0caf5; font-size: 13px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="1.6" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><rect x="13" y="5" width="4" height="4"/><rect x="7" y="15" width="4" height="4"/></svg>
      <span style="flex: 1">Settings</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>

    <button type="button" aria-expanded="true" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 20px; background: transparent; border: 0; border-top: 1px solid #292e42; color: #c0caf5; font-size: 13px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="1.6" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      <span style="flex: 1">Snapshots</span>
      <span style="font-size: 12px; color: #8c94bf">3</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div style="padding: 0 20px 16px; display: flex; flex-direction: column">
      <div style="border: 1px solid rgba(247,118,142,0.45); background: rgba(247,118,142,0.07); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px">
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f7768e" stroke-width="1.8" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          <span style="flex: 1; font-size: 13px; font-weight: 600; color: #f7768e">Restore Oct 12, 2026?</span>
          <span style="font-size: 12px; color: #8c94bf">09:12 UTC</span>
        </div>
        <div style="font-size: 12px; color: #a9b1d6">Replaces Windows. Changes since then are lost.</div>
        <div style="display: flex; gap: 8px; justify-content: flex-end">
          <button type="button" style="height: 36px; padding: 0 16px; background: transparent; border: 1px solid #3b4261; color: #c0caf5; font-size: 12px">Cancel</button>
          <button type="button" style="height: 36px; padding: 0 16px; background: #f7768e; border: 0; color: #16161e; font-size: 12px; font-weight: 600">Restore</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px; border-bottom: 1px solid #24283b">
        <span style="width: 6px; height: 6px; border: 1px solid #565f89; display: block"></span>
        <span style="flex: 1; font-size: 13px">Sep 30, 2026</span>
        <span style="font-size: 12px; color: #8c94bf">18:47 UTC</span>
        <button type="button" aria-label="Restore Sep 30, 2026" title="Restore" style="width: 32px; height: 32px; background: transparent; border: 1px solid #3b4261; color: #a9b1d6; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px; border-bottom: 1px solid #24283b">
        <span style="width: 6px; height: 6px; border: 1px solid #565f89; display: block"></span>
        <span style="flex: 1; font-size: 13px">Sep 02, 2026</span>
        <span style="font-size: 12px; color: #8c94bf">07:05 UTC</span>
        <button type="button" aria-label="Restore Sep 02, 2026" title="Restore" style="width: 32px; height: 32px; background: transparent; border: 1px solid #3b4261; color: #a9b1d6; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      </div>
      <button type="button" style="margin-top: 12px; height: 40px; background: transparent; border: 1px dashed #3b4261; color: #a9b1d6; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Take snapshot
      </button>
    </div>

    <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 20px; background: transparent; border: 0; border-top: 1px solid #292e42; color: #c0caf5; font-size: 13px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="1.6" aria-hidden="true"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/></svg>
      <span style="flex: 1">Logs</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c94bf" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7aa2f7","options":["#7aa2f7","#cba6f7","#a7c080","#d79921"]},"$preview":{"width":460,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#7aa2f7' };
  }
}
</script>
</body>
</html>
